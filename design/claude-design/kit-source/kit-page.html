/* Color — copied verbatim from the tailwind.config blocks in
   design/claude-design/*.html. A Material 3 role set on a cool blue seed,
   plus four non-M3 additions the design files rely on (text-deep,
   border-ice, surface-glass, surface-tint). */
:root{
  /* Primary */
  --color-primary:#00507d;
  --color-on-primary:#ffffff;
  --color-primary-container:#0369a1;
  --color-on-primary-container:#cbe4ff;
  --color-primary-fixed:#cde5ff;
  --color-primary-fixed-dim:#94ccff;
  --color-on-primary-fixed:#001d32;
  --color-on-primary-fixed-variant:#004b74;
  --color-inverse-primary:#94ccff;
  --color-surface-tint:#006399;

  /* Secondary — cyan; used for "done", fit score, past timeline steps */
  --color-secondary:#006686;
  --color-on-secondary:#ffffff;
  --color-secondary-container:#7ed4fd;
  --color-on-secondary-container:#005b78;
  --color-secondary-fixed:#c0e8ff;
  --color-secondary-fixed-dim:#7bd1fa;
  --color-on-secondary-fixed:#001e2b;
  --color-on-secondary-fixed-variant:#004d66;

  /* Tertiary — indigo; reserved accent, sparingly used */
  --color-tertiary:#3535c4;
  --color-on-tertiary:#ffffff;
  --color-tertiary-container:#4f51dc;
  --color-on-tertiary-container:#e0dfff;
  --color-tertiary-fixed:#e1e0ff;
  --color-tertiary-fixed-dim:#c0c1ff;
  --color-on-tertiary-fixed:#07006c;
  --color-on-tertiary-fixed-variant:#2f2ebe;

  /* Error */
  --color-error:#ba1a1a;
  --color-on-error:#ffffff;
  --color-error-container:#ffdad6;
  --color-on-error-container:#93000a;

  /* Surfaces */
  --color-background:#f7f9fb;
  --color-on-background:#191c1e;
  --color-surface:#f7f9fb;
  --color-surface-bright:#f7f9fb;
  --color-surface-dim:#d8dadc;
  --color-surface-container-lowest:#ffffff;
  --color-surface-container-low:#f2f4f6;
  --color-surface-container:#eceef0;
  --color-surface-container-high:#e6e8ea;
  --color-surface-container-highest:#e0e3e5;
  --color-surface-variant:#e0e3e5;
  --color-on-surface:#191c1e;
  --color-on-surface-variant:#40474f;
  --color-inverse-surface:#2d3133;
  --color-inverse-on-surface:#eff1f3;

  /* Outlines + the four non-M3 additions */
  --color-outline:#707881;
  --color-outline-variant:#c0c7d1;
  --color-text-deep:#0f172a;
  --color-border-ice:rgba(3,105,161,0.12);
  --color-surface-glass:rgba(255,255,255,0.7);

  /* Fit-tier / status hues used inline in the design files */
  --color-fit-strong:#006c4a;
  --color-fit-strong-surface:rgba(0,108,74,0.10);
  --color-caution-surface:#fef3c7;
  --color-caution-border:#fde68a;
  --color-caution-text:#92400e;

  /* Semantic aliases — prefer these in product code */
  --text-heading:var(--color-text-deep);
  --text-body:var(--color-on-surface);
  --text-muted:var(--color-on-surface-variant);
  --text-faint:var(--color-outline);
  --text-link:var(--color-primary);
  --text-danger:var(--color-error);
  --surface-page:var(--color-background);
  --surface-card:var(--color-surface-container-lowest);
  --surface-card-glass:var(--color-surface-glass);
  --surface-sunken:var(--color-surface-container);
  --surface-selected:var(--color-primary-fixed);
  --border-hairline:var(--color-border-ice);
  --border-control:var(--color-outline-variant);
  --border-glass:rgba(255,255,255,0.4);
  --action-primary-bg:var(--color-primary);
  --action-primary-fg:var(--color-on-primary);
  --action-primary-bg-hover:var(--color-surface-tint);
}

/* Type — three families, nine named roles, values verbatim from the design
   files' fontFamily/fontSize maps. Headlines are Hanken Grotesk, prose is
   Inter, every label/eyebrow/metric is JetBrains Mono at 0.05em tracking. */
:root{
  --font-display:'Hanken Grotesk',system-ui,sans-serif;
  --font-headline:'Hanken Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-label:'JetBrains Mono',ui-monospace,monospace;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;

  /* headline-display 56/64 -0.02em 700 */
  --text-display-size:56px;--text-display-line:64px;--text-display-tracking:-0.02em;--text-display-weight:700;
  /* headline-lg 32/40 -0.01em 600 (mobile 28/36 600) */
  --text-headline-lg-size:32px;--text-headline-lg-line:40px;--text-headline-lg-tracking:-0.01em;--text-headline-lg-weight:600;
  --text-headline-lg-mobile-size:28px;--text-headline-lg-mobile-line:36px;--text-headline-lg-mobile-weight:600;
  /* headline-md 24/32 600 */
  --text-headline-md-size:24px;--text-headline-md-line:32px;--text-headline-md-weight:600;
  /* body-lg 18/28 400 */
  --text-body-lg-size:18px;--text-body-lg-line:28px;--text-body-lg-weight:400;
  /* body-md 16/24 400 */
  --text-body-md-size:16px;--text-body-md-line:24px;--text-body-md-weight:400;
  /* body-sm 14/20 400 */
  --text-body-sm-size:14px;--text-body-sm-line:20px;--text-body-sm-weight:400;
  /* label-md 14/16 0.05em 500 */
  --text-label-md-size:14px;--text-label-md-line:16px;--text-label-md-tracking:0.05em;--text-label-md-weight:500;
  /* label-sm 12/14 0.05em 500 */
  --text-label-sm-size:12px;--text-label-sm-line:14px;--text-label-sm-tracking:0.05em;--text-label-sm-weight:500;
}

/* Spacing — the named scale from the design files' tailwind spacing map.
   Note gutter and md are both 24px: gutter is grid/section gap, md is
   card padding. Page margins are 64px desktop / 16px mobile. */
:root{
  --space-xs:4px;
  --space-base:8px;
  --space-sm:12px;
  --space-md:24px;
  --space-gutter:24px;
  --space-lg:48px;
  --space-margin-desktop:64px;
  --space-margin-mobile:16px;
  --space-xl:80px;

  --layout-nav-height:80px;
  --layout-side-nav-width:256px;
  --layout-rail-width:384px;
  --layout-max-width:1440px;
}

/* Radii + elevation. The design files ship exactly four radii; cards are
   always xl, controls lg, chips/badges default, pills full. Elevation is
   Tailwind's shadow-sm on nearly everything — the drawer is the one
   exception. Glass surfaces pair blur with a white 40% border. */
:root{
  --radius-default:0.25rem;
  --radius-lg:0.5rem;
  --radius-xl:0.75rem;
  --radius-full:9999px;

  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md:0 4px 6px -1px rgb(0 0 0 / 0.1),0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.1),0 4px 6px -4px rgb(0 0 0 / 0.1);
  --shadow-drawer:0 25px 50px -12px rgb(0 0 0 / 0.25);

  --blur-glass:24px;
  --blur-glass-soft:12px;
  --border-width-hairline:1px;
  --border-width-emphasis:2px;
}

/* Motion. Everything in the design files is a 200ms color/opacity fade plus
   a press scale of 0.95 (side-nav rows translate 1px right instead). No
   bounces, no springs, no entrance animations except one ping on stale data. */
:root{
  --duration-fast:150ms; /* @kind other */
  --duration-base:200ms; /* @kind other */
  --duration-drawer:300ms; /* @kind other */
  --ease-standard:cubic-bezier(0.4,0,0.2,1); /* @kind other */
  --press-scale:0.95; /* @kind other */
  --press-nudge:1px;
  --hover-opacity:0.9; /* @kind other */
}

/* Component styling for the Opportunity Radar kit. Every value here is lifted
   from design/claude-design/*.html; hover/press states live in CSS because the
   design relies on them (200ms color fade + 0.95 press scale). */
.or-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--font-label);font-size:var(--text-label-md-size);line-height:var(--text-label-md-line);letter-spacing:var(--text-label-md-tracking);font-weight:var(--text-label-md-weight);padding:8px 16px;border-radius:var(--radius-lg);border:1px solid transparent;cursor:pointer;text-decoration:none;transition:background-color var(--duration-base) var(--ease-standard),color var(--duration-base) var(--ease-standard),opacity var(--duration-base) var(--ease-standard),transform var(--duration-base) var(--ease-standard)}
.or-btn:active{transform:scale(var(--press-scale))}
.or-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.or-btn--filled{background:var(--color-primary);color:var(--color-on-primary);box-shadow:var(--shadow-sm)}
.or-btn--filled:hover:not(:disabled){background:var(--color-surface-tint)}
.or-btn--outline{border-color:var(--color-outline-variant);color:var(--color-on-surface-variant);background:transparent}
.or-btn--outline:hover:not(:disabled){background:var(--color-surface-container-highest)}
.or-btn--tonal{background:var(--color-surface-container);border-color:var(--color-outline-variant);color:var(--color-text-deep)}
.or-btn--tonal:hover:not(:disabled){background:var(--color-surface-container-high)}
.or-btn--glass{border-radius:var(--radius-full);border-color:var(--color-border-ice);background:var(--color-surface-glass);backdrop-filter:blur(var(--blur-glass-soft));color:var(--color-primary);box-shadow:var(--shadow-sm)}
.or-btn--glass:hover:not(:disabled){background:var(--color-surface-container-low)}
.or-btn--text{background:none;border:0;padding:0;color:var(--color-primary)}
.or-btn--text:hover:not(:disabled){text-decoration:underline}
.or-btn--danger-text{background:none;border:0;padding:0;color:var(--color-error);font-weight:700}
.or-btn--danger-text:hover:not(:disabled){text-decoration:underline}
.or-btn--pill{border-radius:var(--radius-full);padding:8px 24px}
.or-btn--sm{font-size:var(--text-label-sm-size);line-height:var(--text-label-sm-line);padding:4px 12px}
.or-btn--block{width:100%}

.or-iconbtn{display:inline-flex;align-items:center;justify-content:center;padding:8px;border:0;border-radius:var(--radius-full);background:none;color:var(--color-on-surface-variant);cursor:pointer;transition:background-color var(--duration-base) var(--ease-standard),color var(--duration-base) var(--ease-standard),transform var(--duration-base) var(--ease-standard)}
.or-iconbtn:hover{background:var(--color-surface-container-low);color:var(--color-primary)}
.or-iconbtn:active{transform:scale(var(--press-scale))}
.or-iconbtn--active{color:var(--color-primary)}
.or-iconbtn--sm{padding:6px}

.or-badge{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-label);font-size:var(--text-label-sm-size);line-height:var(--text-label-sm-line);letter-spacing:var(--text-label-sm-tracking);font-weight:var(--text-label-sm-weight);padding:2px 8px;border-radius:var(--radius-default);border:1px solid transparent;white-space:nowrap}
.or-badge--pill{border-radius:var(--radius-full);padding:2px 10px}
.or-badge--fit{background:var(--color-fit-strong-surface);color:var(--color-fit-strong)}
.or-badge--caution{background:var(--color-caution-surface);color:var(--color-caution-text);border-color:var(--color-caution-border)}
.or-badge--danger{background:var(--color-error-container);color:var(--color-on-error-container);font-weight:700}
.or-badge--neutral{background:var(--color-surface-variant);color:var(--color-on-surface-variant)}
.or-badge--primary{background:var(--color-primary-fixed);color:var(--color-on-primary-fixed-variant)}
.or-badge--secondary{background:var(--color-secondary-fixed);color:var(--color-on-secondary-fixed-variant)}
.or-badge--outline{background:transparent;border-color:var(--color-outline);color:var(--color-on-surface-variant)}

.or-card{position:relative;background:var(--surface-card);border:1px solid var(--color-border-ice);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);padding:var(--space-md)}
.or-card--glass{background:var(--color-surface-glass);backdrop-filter:blur(var(--blur-glass));border-color:var(--border-glass)}
.or-card--sunken{background:var(--color-surface-container);box-shadow:none}
.or-card--dashed{background:var(--color-surface-container);border:2px dashed var(--color-outline-variant);box-shadow:none;opacity:.8;transition:opacity var(--duration-base) var(--ease-standard)}
.or-card--dashed:hover{opacity:1}
.or-card--outlined{border-color:var(--color-primary-container)}
.or-card--flush{padding:0;overflow:hidden}

.or-avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-full);font-family:var(--font-headline);font-weight:700;background:var(--color-primary-container);color:var(--color-on-primary-container);object-fit:cover;flex:none}
.or-avatar--muted{background:var(--color-surface-dim);color:var(--color-on-surface-variant);font-family:var(--font-label);font-weight:500}

.or-stat{display:flex;align-items:center;gap:8px;background:var(--color-surface-container-lowest);border:1px solid var(--color-border-ice);border-radius:var(--radius-lg);padding:8px 16px}
.or-stat__label{font-family:var(--font-label);font-size:var(--text-label-sm-size);line-height:var(--text-label-sm-line);letter-spacing:var(--text-label-sm-tracking);color:var(--color-on-surface-variant);margin:0}
.or-stat__value{font-family:var(--font-body);font-size:var(--text-body-md-size);line-height:var(--text-body-md-line);font-weight:600;color:var(--color-text-deep);margin:0}

.or-kv{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--color-border-ice);padding-bottom:4px}
.or-kv__label{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-label);font-size:var(--text-label-sm-size);line-height:var(--text-label-sm-line);letter-spacing:var(--text-label-sm-tracking);color:var(--color-outline)}
.or-kv__value{font-family:var(--font-body);font-size:var(--text-body-sm-size);line-height:var(--text-body-sm-line);font-weight:500;color:var(--color-text-deep)}
.or-kv--danger .or-kv__label,.or-kv--danger .or-kv__value{color:var(--color-error)}
.or-ping{position:relative;display:inline-flex;width:8px;height:8px}
.or-ping span:first-child{position:absolute;display:inline-flex;width:100%;height:100%;border-radius:9999px;background:var(--color-error);opacity:.75;animation:or-ping 1s cubic-bezier(0,0,.2,1) infinite}
.or-ping span:last-child{position:relative;display:inline-flex;width:8px;height:8px;border-radius:9999px;background:var(--color-error)}
@keyframes or-ping{75%,100%{transform:scale(2);opacity:0}}

.or-progress{width:100%;height:4px;background:var(--color-surface-container);overflow:hidden}
.or-progress--rounded{border-radius:var(--radius-full)}
.or-progress--top{position:absolute;top:0;left:0}
.or-progress__fill{height:100%;background:var(--color-primary)}

.or-nav{display:flex;justify-content:space-between;align-items:center;width:100%;height:var(--layout-nav-height);padding:0 var(--space-margin-desktop);background:var(--color-surface-container-lowest);border-bottom:1px solid var(--color-border-ice);box-shadow:var(--shadow-sm);flex:none;position:relative;z-index:50}
.or-nav--glass{background:var(--color-surface-glass);backdrop-filter:blur(var(--blur-glass));border-bottom:0}

<script type="text/babel" data-presets="react">
const { TopNavBar } = window.OpportunityRadarDesignSystem_3ee40b;

function App() {
  const [view, setView] = React.useState("Opportunity Map");
  const [drawer, setDrawer] = React.useState(true);
  const workspace = view === "Pursuit Workspace";
  return (
    <React.Fragment>
      <TopNavBar
        brand="Federal Catalyst"
        glass={workspace}
        links={["Opportunity Map", "Pursuit Workspace", "Screening", "Utah View"]}
        activeLink={view}
        onNavigate={(l) => setView(l)}
        actions={["notifications", "help", "account_circle"]}
        cta="Apply Now"
      />
      {workspace ? (
        <window.PursuitWorkspaceScreen />
      ) : (
        <React.Fragment>
          <div style={{ flex: 1, overflowY: "auto" }}>
            <window.OpportunityMapScreen drawerOpen={drawer} />
          </div>
          <window.AssistantDrawer open={drawer} onClose={() => setDrawer(false)} />
          {!drawer ? (
            <button type="button" onClick={() => setDrawer(true)}
              className="or-btn or-btn--filled or-btn--pill"
              style={{ position: "fixed", right: 24, bottom: 24, zIndex: 60 }}>
              <span className="material-symbols-outlined" style={{ fontSize: 18 }}>auto_awesome</span> Assistant
            </button>
          ) : null}
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

function boot() {
  if (!window.OpportunityMapScreen || !window.PursuitWorkspaceScreen || !window.AssistantDrawer) return setTimeout(boot, 40);
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
boot();
</script>
